name: Health check
# Pings the deployed web app and backend. A failed run emails the repo owner and watchers.
# Scheduled runs are best-effort on GitHub's side, and also help keep the free Render instance warm.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Web app
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 -o /dev/null https://lokality-web.kanithisathvik2005.workers.dev/
      - name: Backend API (allow for free-tier cold start)
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors -o /dev/null https://lokality-backend.onrender.com/api/health
